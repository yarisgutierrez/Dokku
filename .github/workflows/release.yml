name: Release

# Pushing a tag such as v0.3.0 builds the .deb and publishes a GitHub release with the
# matching CHANGELOG section as its notes. The tag must match the version in meson.build.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version
        run: |
          version=$(sed -n "s/^ *version: *'\([0-9][0-9.]*\)'.*/\1/p" meson.build | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match meson.build version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $VERSION" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valac meson ninja-build libgtk-3-dev libwnck-3-dev \
            libgtk-layer-shell-dev libkeybinder-3.0-dev libx11-dev libwayland-dev \
            libwayland-bin libatspi2.0-dev dpkg-dev

      - name: Build the .deb
        run: packaging/build-deb.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "Dokku $VERSION" --notes-file notes.md
