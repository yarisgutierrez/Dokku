name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valac meson ninja-build libgtk-3-dev libwnck-3-dev \
            libgtk-layer-shell-dev libkeybinder-3.0-dev libx11-dev libwayland-dev \
            libwayland-bin libatspi2.0-dev dpkg-dev desktop-file-utils

      - name: Build
        run: |
          meson setup build --buildtype=release
          ninja -C build

      - name: The binary starts
        run: ./build/src/dokku --version

      - name: Desktop files are valid
        run: desktop-file-validate data/dokku.desktop data/dokku-autostart.desktop

      - name: Build the .deb
        run: packaging/build-deb.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dokku-deb
          path: dist/*.deb
